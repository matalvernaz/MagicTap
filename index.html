<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagicTap, V.0.4</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modules/panels.css">
</head>
<body>
    <main>
        <h1 id="game-title">MagicTap, V.0.4</h1>

        <div id="runestone-container" aria-label="Runestones"></div>

        <div id="notification-area" aria-live="assertive" aria-atomic="true"></div>

        <section class="game-stats">
            <p id="mana-display">0 Mana</p>
            <p id="mps-display">0.0 MPS</p>
            <p id="mpc-display">1 per click</p>
            <p id="proficiency-display" style="display: none;" aria-label="Wizard Proficiency"></p>
            <div id="active-spells-main" style="display: none;" aria-label="Active spell effects"></div>
        </section>

        <section class="game-actions">
            <button id="gather-mana-button" aria-label="Gather Mana">Gather Mana</button>
        </section>

        <h2 id="events-heading" style="display: none;">Events</h2>
        <section id="events-log" style="display: none;" aria-live="polite"></section>

        <h2 id="upgrades-heading">Upgrades</h2>
        <section id="upgrades-container"></section>

        <h2 id="buildings-heading">Buildings</h2>
        <section id="buildings-container"></section>

        <section id="purchased-upgrades-panel" class="game-panel" hidden>
            <h2 id="purchased-upgrades-heading" tabindex="-1">Purchased Upgrades</h2>
            <div id="purchased-upgrades-container" aria-labelledby="purchased-upgrades-heading"></div>
        </section>

        <div id="panels-container"></div>
    </main>

    <div id="finish-prestige-container">
        <button id="finish-prestige-button" style="display: none;">Finish Prestige</button>
    </div>

    <footer>
        <nav aria-label="Game Navigation">
            <button id="statistics-button">Statistics</button>
            <button id="achievements-button">Achievements</button>
            <button id="upgrades-button" style="display: none;">Upgrades</button>
            <button id="ranking-upgrades-button" style="display: none;">Ranking Upgrades</button>
            <button id="production-button" style="display: none;">Production</button>
            <button id="prestige-button" style="display: none;">Prestige</button>
            <button id="challenges-button" style="display: none;">Challenges</button>
            <button id="transcendence-button-nav" style="display: none;">Transcendence</button>
            <button id="wishing-well-button" style="display: none;">Wishing Well</button>
            <button id="spellcasting-button" style="display: none;">Spellcasting</button>
            <button id="changelog-button">Changelog</button>
            <button id="options-button">Options</button>
        </nav>
    </footer>

    <script>
        // Global error handler to catch and display JavaScript errors
        window.onerror = function(message, source, lineno, colno, error) {
            const errorDiv = document.createElement('div');
            errorDiv.id = 'error-display';
            errorDiv.setAttribute('role', 'alert');
            errorDiv.style.cssText = 'background: #ffcccc; border: 2px solid #cc0000; padding: 20px; margin: 20px; color: #000;';
            errorDiv.innerHTML = '<h2>Game Error</h2>' +
                '<p>An error occurred while loading the game. This may be caused by corrupted game data.</p>' +
                '<p><strong>Error:</strong> ' + message + '</p>' +
                '<p><strong>Location:</strong> ' + source + ' (line ' + lineno + ')</p>' +
                '<p>Try clearing your browser cache or resetting the game save data.</p>';
            document.body.insertBefore(errorDiv, document.body.firstChild);
            return false;
        };
    </script>
    <script src="modules/statistics.js"></script>
    <script src="modules/achievements.js"></script>
    <script src="modules/wizardRank.js"></script>
    <script src="modules/production.js"></script>
    <script src="modules/prestige.js"></script>
    <script src="modules/changelog.js"></script>
    <script src="modules/options.js"></script>
    <script src="modules/wishingWell.js"></script>
    <script src="modules/rankingUpgrades.js"></script>
    <script src="modules/flavorEvents.js"></script>
    <script src="modules/tutorial.js"></script>
    <script src="modules/transcendence.js"></script>
    <script src="modules/challenges.js"></script>
    <script src="modules/runestones.js"></script>
    <script src="modules/spellcasting.js"></script>
    <script src="modules/sound.js"></script>
    <script src="modules/saveManager.js"></script>
    <script src="app.js"></script>
</body>
</html>
